<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Home Radar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="control-panel" aria-label="Flight radar controls">
        <div class="brand">
          <div>
            <p class="eyebrow">Flight Home Radar</p>
            <h1>Aircraft inside your home radius</h1>
          </div>
          <div id="livePill" class="live-pill is-live">Live</div>
        </div>

        <form id="settingsForm" class="settings-grid">
          <label>
            Latitude
            <input id="latInput" name="lat" type="number" step="0.000001" required />
          </label>
          <label>
            Longitude
            <input id="lonInput" name="lon" type="number" step="0.000001" required />
          </label>
          <label>
            Radius
            <span class="unit-input">
              <input id="radiusInput" name="radius" type="number" min="0.1" max="50" step="0.1" required />
              <span>mi</span>
            </span>
          </label>
          <label>
            Source
            <select id="providerInput" name="provider">
              <option value="demo">Demo traffic</option>
              <option value="airplanes">Airplanes.live</option>
              <option value="adsblol">adsb.lol</option>
              <option value="adsbx">ADSB Exchange</option>
            </select>
          </label>
          <label class="api-key">
            API key
            <input id="apiKeyInput" name="apiKey" type="password" autocomplete="off" />
          </label>
          <label>
            Refresh
            <span class="unit-input">
              <input id="intervalInput" name="interval" type="number" min="2" max="60" step="1" required />
              <span>s</span>
            </span>
          </label>
          <div class="actions">
            <button type="button" id="geoButton" class="ghost-button" title="Use current location">
              <span aria-hidden="true">⌖</span>
              <span id="geoButtonText">Locate</span>
            </button>
            <button type="submit" id="saveButton" class="primary-button">Save</button>
            <button type="button" id="toggleButton" class="icon-button" title="Pause updates" aria-label="Pause updates">
              <span id="toggleIcon" aria-hidden="true">Ⅱ</span>
            </button>
          </div>
        </form>
        <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>

        <div class="status-row">
          <div>
            <span class="metric-label">Inside Radius</span>
            <strong id="insideCount">0</strong>
          </div>
          <div>
            <span class="metric-label">Closest</span>
            <strong id="closestMetric">--</strong>
          </div>
          <div>
            <span class="metric-label">Updated</span>
            <strong id="updatedMetric">--</strong>
          </div>
        </div>
      </section>

      <section class="radar-layout">
        <div class="radar-stage">
          <div id="radar" class="radar" aria-label="Aircraft movement radar">
            <div class="sweep"></div>
            <div class="range-ring ring-one"></div>
            <div class="range-ring ring-two"></div>
            <div class="range-ring ring-three"></div>
            <div class="crosshair horizontal"></div>
            <div class="crosshair vertical"></div>
            <div class="home-dot" title="Home"></div>
            <div id="trailLayer" class="trail-layer"></div>
            <div id="aircraftLayer" class="aircraft-layer"></div>
          </div>
        </div>

        <aside class="details-panel">
          <div class="panel-heading">
            <h2>Nearby Flights</h2>
            <span id="sourceLabel">Demo traffic</span>
          </div>
          <div id="errorBox" class="error-box" hidden></div>
          <div id="flightList" class="flight-list"></div>
          <div class="panel-heading history-heading">
            <h2>Recent Passes</h2>
            <span id="historyCount">0</span>
          </div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
